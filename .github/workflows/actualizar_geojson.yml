name: Actualizar GeoJSON de Estaciones

on:
  schedule:
    - cron: '0 * * * *' # Se ejecuta al minuto 0 de cada hora
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions de GitHub

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install beautifulsoup4

      - name: Ejecutar script de generación
        run: |
          python generar_geojson.py

      - name: Commit y Push de los cambios
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add estaciones.geojson
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualización automática de estaciones.geojson [skip ci]" && git push)
